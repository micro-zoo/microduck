# Creates the `nfcd` system user and group.
#
# Install to /usr/lib/sysusers.d/nfcd.conf; systemd-sysusers creates them at boot, or run
# `systemd-sysusers` once by hand.
#
# Unprivileged for the same reason as `tofd`: it needs exactly one device — the reader's serial
# port — and that comes from `dialout`, granted in nfcd.service, not from being root. What it may
# ask of the robot it asks over sockets, like any other client.
#
# nfcd.service will fail to start if this user does not exist.
u nfcd - "Robot NFC reader daemon" - -
